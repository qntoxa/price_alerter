version: '3.9'

services:
  alerter:
    build: .
    container_name: price-alerter
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - HTTP_ADDR=:8080
      - GRPC_ADDR=:9090
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/alerter?sslmode=disable
      - REDIS_ADDR=redis:6379
      - QUOTE_CACHE_TTL_MS=250
      - WORKER_COUNT=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: price-alerter-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alerter
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alerter"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: price-alerter-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: price-alerter-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - alerter

volumes:
  pgdata:
